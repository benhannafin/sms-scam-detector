<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SMS Scam Detector{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('web.static', filename='css/styles.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="{{ url_for('web.home') }}">
        <span class="logo-mark">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>
        </span>
        <span>SMS Scam Detector</span>
      </a>
      <nav class="nav" aria-label="Main">{% block nav %}{% endblock %}</nav>
    </div>
  </header>
  <main class="page">{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
